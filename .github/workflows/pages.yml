name: Publicar Onda en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pruebas de Onda
        run: node --test tests/*.test.cjs
      - name: Comprobar JavaScript propio
        run: |
          node --check web/app.js
          node --check web/catalog.js
          node --check web/globe.js
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
